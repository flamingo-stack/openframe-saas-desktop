name: Setup macOS code signing
description: >-
  Import the Apple Developer ID certificate into a throwaway keychain and export
  SIGNING_IDENTITY so `tauri build` signs the .app during the build — mandatory
  once createUpdaterArtifacts is on, since tauri tars and minisigns the .app as
  part of the build. No-ops with a warning when no certificate is configured.
  Delete the keychain afterwards with an `if: always()` step.

inputs:
  apple_certificate_p12:
    description: 'Base64 encoded Apple Developer certificate (.p12). Empty disables signing.'
    required: false
    default: ''
  apple_certificate_password:
    description: 'Password for the .p12 certificate'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Report signing mode
      shell: bash
      env:
        CERT: ${{ inputs.apple_certificate_p12 }}
      run: |
        if [[ -z "$CERT" ]]; then
          echo "MACOS_SIGNING=false" >> "$GITHUB_ENV"
          echo "::warning::APPLE_CERTIFICATE_P12 is not set — building an UNSIGNED macOS app. OS notifications will not work (UNErrorDomain error 1) and Gatekeeper blocks it elsewhere."
        else
          echo "MACOS_SIGNING=true" >> "$GITHUB_ENV"
        fi

    - name: Import certificate into throwaway keychain
      if: env.MACOS_SIGNING == 'true'
      shell: bash
      env:
        APPLE_CERTIFICATE_P12: ${{ inputs.apple_certificate_p12 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.apple_certificate_password }}
      run: |
        set -euo pipefail
        CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

        echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
        security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"
        security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

        security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        rm "$CERTIFICATE_PATH"
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

        SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
        if [[ -z "$SIGNING_IDENTITY" ]]; then
          echo "::error::No Developer ID Application identity found in keychain"
          exit 1
        fi
        echo "Found signing identity: $SIGNING_IDENTITY"
        echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
