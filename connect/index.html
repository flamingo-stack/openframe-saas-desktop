<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect to OpenFrame</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #161616;
        --card: #212121;
        --border: #3a3a3a;
        --text: #fafafa;
        --muted: #888888;
        --accent: #ffc008;
        --error: #f36666;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 0; }
      p { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.5; }
      form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
      label { font-size: 12px; color: var(--muted); }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 14px;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      button {
        padding: 12px 14px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #161616;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .error { color: var(--error); font-size: 12px; min-height: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Connect to OpenFrame</h1>
      <p>Enter your OpenFrame instance address to open it in the desktop app.</p>
      <form id="form">
        <label for="host">Instance address</label>
        <input id="host" name="host" placeholder="acme.openframe.ai" autocomplete="off" autofocus />
        <div class="error" id="error"></div>
        <button type="submit" id="submit">Connect</button>
      </form>
    </div>

    <script>
      const invoke = window.__TAURI__?.core?.invoke;
      const form = document.getElementById('form');
      const hostInput = document.getElementById('host');
      const errorEl = document.getElementById('error');
      const submitBtn = document.getElementById('submit');

      // Prefill with the previously used host, if any.
      invoke?.('get_tenant_host')
        .then((host) => {
          if (host) hostInput.value = host;
        })
        .catch(() => {});

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        const host = hostInput.value.trim();
        if (!host) {
          errorEl.textContent = 'Please enter an instance address.';
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Connecting…';
        try {
          await invoke('set_tenant_host', { host });
        } catch (err) {
          errorEl.textContent = typeof err === 'string' ? err : 'Failed to connect.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Connect';
        }
      });
    </script>
  </body>
</html>
