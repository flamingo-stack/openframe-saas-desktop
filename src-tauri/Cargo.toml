[package]
name = "openframe-console"
version = "0.1.0"
description = "OpenFrame Console"
authors = ["OpenFrame"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes the video players' fullscreen button work:
# element fullscreen in a WKWebView sits behind WKPreferences' private
# `fullScreenEnabled` key, which wry sets only under this feature (paired with
# `macOSPrivateApi` in tauri.conf.json). Windows and Linux need nothing — their
# webviews allow it by default. Rules this app out of the Mac App Store, which
# it is not shipped through: distribution is the in-app updater.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
url = "2"
# NativeAuth bridge: native dev-ticket exchange (reads tokens off response
# headers a cross-origin webview fetch can't) + the oneshot that parks
# native_auth_start until the OS hands back the openframe-console://auth callback.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# JWT payload decode (exp claim) for the shell-owned token refresh schedule.
base64 = "0.22"
# Background notification plane (NATS user.<id>.notification -> OS toasts).
# The flamingo fork adds auth_url_callback — async-nats re-invokes it on every
# reconnect so the expiring bearer riding on the WS URL can be re-supplied.
async-nats = { git = "https://github.com/flamingo-stack/nats.rs.git", branch = "main", features = ["websockets"] }
futures = "0.3"
rand = "0.8"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }

# Toasts (WinRT: Data_Xml_Dom, UI_Notifications) plus the two things a toast
# button needs that protocol activation cannot give it — an in-process call and
# the inline reply text — which arrive through a COM activator
# (Win32_UI_Notifications for INotificationActivationCallback, Win32_System_Com
# for the class object that serves it). winreg registers both that activator's
# CLSID and the openframe-console:// scheme the toast body still activates.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Notifications",
] }
# Direct dependency because `#[implement]` expands to absolute `::windows_core::`
# paths, which resolve against this crate's extern prelude — reaching it only as
# `windows::core` is not enough. Same reason tao and webview2-com declare it.
# Bump it in lockstep with `windows`: if the two resolve to different major
# versions the macro's `::windows_core::IUnknownImpl` stops satisfying the
# `_Impl` supertrait, and the error points nowhere near this file.
windows-core = "0.61"
winreg = "0.52"

# UNUserNotificationCenter backend (clicks survive the process, unlike the
# deprecated NSUserNotificationCenter path), plus the NSWorkspace wake
# notification the token refresh hangs off.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSError",
    "NSNotification",
    "NSOperation",
    "NSSet",
    "NSString",
] }
objc2-user-notifications = { version = "0.3.2", features = [
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
